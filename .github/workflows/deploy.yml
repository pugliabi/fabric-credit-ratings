name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # The token is not left in .git/config for build-time code to find; the commit step adds it per command.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - run: npm ci

      # npm run build typechecks api/ (tsc -p api), which needs the API's own packages. Install scripts are skipped:
      # Core Tools' postinstall downloads a ~585 MB zip that the build never uses.
      - run: npm ci --prefix api --ignore-scripts

      - name: Fetch the published ratings
        id: snapshot
        if: ${{ vars.API_URL != '' }}
        env:
          FCR_API_URL: ${{ vars.API_URL }}
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: npm run snapshot

      - name: Commit the snapshot if it changed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/snapshot.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/snapshot.json
          git commit -m "Snapshot $(node -p "require('./src/data/snapshot.json').asOf || 'empty'")"
          # The same header actions/checkout would have persisted, scoped to these two commands.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for _ in 1 2 3; do
            if git -c http.extraheader="$auth" pull --rebase origin "$GITHUB_REF_NAME" \
                && git -c http.extraheader="$auth" push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Could not push the snapshot commit. This deploy still uses it."

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Tell the API which snapshot is live
        if: ${{ steps.snapshot.outputs.generatedAt != '' }}
        env:
          FCR_API_URL: ${{ vars.API_URL }}
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
          GENERATED_AT: ${{ steps.snapshot.outputs.generatedAt }}
        run: |
          body=$(jq -cn --arg at "$GENERATED_AT" '{generatedAt: $at}')
          # The token reaches curl through stdin (-H @-), never the command line.
          if ! printf 'Authorization: Bearer %s\n' "$SNAPSHOT_TOKEN" | curl -sS --fail-with-body --max-time 200 --retry 2 \
              -X POST "${FCR_API_URL%/}/api/build/snapshot/deployed" \
              -H @- -H 'Content-Type: application/json' --data "$body"; then
            echo "::warning::The site is live, but the API wasn't told. The admin page shows it as behind until the next deploy."
          fi
